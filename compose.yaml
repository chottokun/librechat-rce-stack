# ==============================================================================
# LibreChat RCE Stack - Docker Compose 基底構成
# ==============================================================================
#
# 3層完全分離ネットワークアーキテクチャ:
#   public-frontend : Nginx ↔ LibreChat API ↔ MongoDB
#   rce-backend     : LibreChat API ↔ Code API (Ed25519 Bearer JWT 相互認証)
#   rce-isolated    : Code API ↔ Redis ↔ MinIO ↔ Worker ↔ Sandbox (internal: true)
#
# 起動方法:
#   ./setup.sh
#   (または docker compose -f compose.yaml -f compose.kvm.yaml up -d)
# ==============================================================================

networks:
  # フロントエンド公開層 (Nginx / Web UI)
  public-frontend:
    driver: bridge

  # RCE 連携層 (LibreChat ↔ CodeAPI 間の通信経路)
  rce-backend:
    driver: bridge

  # サンドボックス完全隔離層 (外部インターネットおよびホストNWへのルーティング完全遮断)
  rce-isolated:
    driver: bridge
    internal: true

services:

  # ----------------------------------------------------------------------------
  # 1. SSL/TLS リバースプロキシ (Nginx)
  # ----------------------------------------------------------------------------
  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    container_name: rce-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./config/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./config/nginx/certs:/etc/nginx/certs:ro
    networks:
      - public-frontend
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-check-certificate", "--spider", "-q", "http://127.0.0.1:80/nginx-health"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 2. LibreChat コア API
  # ----------------------------------------------------------------------------
  api:
    image: ${LIBRECHAT_IMAGE:-ghcr.io/danny-avila/librechat:v0.8.8-rc4}
    container_name: rce-librechat-api
    restart: unless-stopped
    environment:
      - PORT=${LIBRECHAT_PORT:-3080}
      - MONGO_URI=mongodb://mongodb:27017/LibreChat
      - DOMAIN_CLIENT=${DOMAIN_CLIENT:-https://localhost}
      - DOMAIN_SERVER=${DOMAIN_SERVER:-https://localhost}
      - CONFIG_BYPASS_VALIDATION=${CONFIG_BYPASS_VALIDATION:-true}
      - ALLOW_REGISTRATION=${ALLOW_REGISTRATION:-true}
      - ALLOW_EMAIL_LOGIN=${ALLOW_EMAIL_LOGIN:-true}
      - ALLOW_UNVERIFIED_EMAIL_LOGIN=${ALLOW_UNVERIFIED_EMAIL_LOGIN:-true}
      - ALLOW_PASSWORD_RESET=${ALLOW_PASSWORD_RESET:-false}
      - ALLOW_SOCIAL_LOGIN=${ALLOW_SOCIAL_LOGIN:-false}
      - ALLOW_SOCIAL_REGISTRATION=${ALLOW_SOCIAL_REGISTRATION:-false}
      - SESSION_EXPIRY=${SESSION_EXPIRY:-86400000}
      - REFRESH_TOKEN_EXPIRY=${REFRESH_TOKEN_EXPIRY:-2592000000}
      - JWT_SECRET=${JWT_SECRET:?run ./setup.sh}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?run ./setup.sh}
      - CREDS_KEY=${CREDS_KEY:?run ./setup.sh}
      - CREDS_IV=${CREDS_IV:?run ./setup.sh}
      # 外部 LLM
      - EXTERNAL_API_URL=${EXTERNAL_API_URL:-}
      - EXTERNAL_API_KEY=${EXTERNAL_API_KEY:-}
      - EXTERNAL_LLM_MODEL=${EXTERNAL_LLM_MODEL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Code Interpreter ゼロトラスト認証 (librechat-jwt)
      - LIBRECHAT_CODE_BASEURL=http://code-api:3112/v1
      - CODEAPI_AUTH_PROVIDER=librechat-jwt
      - CODEAPI_JWT_ALGORITHM=${CODEAPI_JWT_ALGORITHM:-EdDSA}
      - CODEAPI_JWT_KID=${CODEAPI_JWT_KID:?run ./setup.sh}
      - CODEAPI_JWT_ISSUER=${CODEAPI_JWT_ISSUER:-librechat}
      - CODEAPI_JWT_AUDIENCE=${CODEAPI_JWT_AUDIENCE:-codeapi}
      - CODEAPI_JWT_TTL_SECONDS=300
      - CODEAPI_JWT_MINT_CACHE_SECONDS=30
      - CODEAPI_JWT_SINGLE_TENANT_ID=${CODEAPI_JWT_SINGLE_TENANT_ID:-default}
      - CODEAPI_JWT_PRIVATE_JWK_JSON=${CODEAPI_JWT_PRIVATE_JWK_JSON:?run ./setup.sh}
    volumes:
      - ./config/librechat.yaml:/app/librechat.yaml:ro
    networks:
      - public-frontend
      - rce-backend
    depends_on:
      mongodb:
        condition: service_healthy
      code-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 3. データベース (MongoDB)
  # ----------------------------------------------------------------------------
  mongodb:
    image: ${MONGODB_IMAGE:-mongo:7.0}
    container_name: rce-mongodb
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    networks:
      - public-frontend
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 4. S3 互換オブジェクトストレージ (MinIO)
  # ----------------------------------------------------------------------------
  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z}
    container_name: rce-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-enterprise_rce_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run ./setup.sh}
    volumes:
      - minio_data:/data
    networks:
      - rce-isolated
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 4a. MinIO バケット自動初期化 (ワンショットジョブ)
  # ----------------------------------------------------------------------------
  minio-init:
    image: ${MINIO_MC_IMAGE:-quay.io/minio/mc:latest}
    container_name: rce-minio-init
    entrypoint: >
      /bin/sh -c "
      until mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} 2>/dev/null; do
        sleep 2;
      done;
      mc mb myminio/$${MINIO_BUCKET} --ignore-existing;
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-enterprise_rce_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?run ./setup.sh}
      MINIO_BUCKET: ${MINIO_BUCKET:-code-interpreter-files}
    networks:
      - rce-isolated
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # ----------------------------------------------------------------------------
  # 5. タスクキュー & セッションキャッシュ (Redis)
  # ----------------------------------------------------------------------------
  redis:
    image: ${REDIS_IMAGE:-redis:7.4-alpine}
    container_name: rce-redis
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD:?run ./setup.sh}" --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - rce-isolated
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?run ./setup.sh}", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 6. Code Interpreter API Gateway (上流公式 GHCR イメージ)
  # ----------------------------------------------------------------------------
  code-api:
    image: ${CODEAPI_API_IMAGE:-ghcr.io/librechat-ai/code-interpreter-api:sha-2fa9f0d43e8e38b7d6240bc76e2483c6a47c64c7}
    container_name: rce-code-api
    restart: unless-stopped
    pull_policy: missing
    environment:
      - LOCAL_MODE=false
      - CODEAPI_HARDENED_SANDBOX_MODE=true
      - SERVICE_PORT=3112
      - CODEAPI_AUTH_PROVIDER=librechat-jwt
      - CODEAPI_JWT_ISSUER=${CODEAPI_JWT_ISSUER:-librechat}
      - CODEAPI_JWT_AUDIENCE=${CODEAPI_JWT_AUDIENCE:-codeapi}
      - CODEAPI_JWT_ALLOWED_ALGS=${CODEAPI_JWT_ALGORITHM:-EdDSA}
      - CODEAPI_JWT_CLOCK_SKEW_SECONDS=30
      - CODEAPI_JWT_MAX_TTL_SECONDS=300
      - CODEAPI_JWT_KEY_CACHE_TTL_SECONDS=30
      - CODEAPI_JWT_JWKS_JSON=${CODEAPI_JWT_JWKS_JSON:?run ./setup.sh}
      - CODEAPI_JWT_SINGLE_TENANT_ID=${CODEAPI_JWT_SINGLE_TENANT_ID:-default}
      - SANDBOX_ENDPOINT=http://sandbox-runner:2000/api/v2
      - EGRESS_GATEWAY_URL=http://egress-gateway:3190
      - FILE_SERVER_URL=http://file-server:3000
      - TOOL_CALL_SERVER_URL=http://tool-call-server:3033
      - CODEAPI_INTERNAL_SERVICE_TOKEN=${CODEAPI_INTERNAL_SERVICE_TOKEN:?run ./setup.sh}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?run ./setup.sh}
    depends_on:
      redis:
        condition: service_healthy
      tool-call-server:
        condition: service_healthy
      file-server:
        condition: service_healthy
      egress-gateway:
        condition: service_healthy
    networks:
      - rce-backend
      - rce-isolated
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3112/v1/health').then(r=>process.exit(r.ok?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 7. Code Interpreter Service Worker (上流公式 GHCR イメージ)
  # ----------------------------------------------------------------------------
  service-worker:
    image: ${CODEAPI_WORKER_IMAGE:-ghcr.io/librechat-ai/code-interpreter-worker:sha-2fa9f0d43e8e38b7d6240bc76e2483c6a47c64c7}
    container_name: rce-service-worker
    restart: unless-stopped
    pull_policy: missing
    environment:
      - LOCAL_MODE=false
      - CODEAPI_HARDENED_SANDBOX_MODE=true
      - SANDBOX_ENDPOINT=http://sandbox-runner:2000/api/v2
      - EGRESS_GATEWAY_URL=http://egress-gateway:3190
      - CODEAPI_INTERNAL_SERVICE_TOKEN=${CODEAPI_INTERNAL_SERVICE_TOKEN:?run ./setup.sh}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?run ./setup.sh}
      - PYTHON_CONCURRENCY=${PYTHON_CONCURRENCY:-5}
      - OTHER_CONCURRENCY=${OTHER_CONCURRENCY:-15}
      - WORKER_HEALTH_PORT=3113
      - CODEAPI_EXECUTION_MANIFEST_PRIVATE_KEY=${CODEAPI_EXECUTION_MANIFEST_PRIVATE_KEY:?run ./setup.sh}
    depends_on:
      redis:
        condition: service_healthy
      sandbox-runner:
        condition: service_healthy
    networks:
      - rce-isolated
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3113/health').then(r=>process.exit(r.ok?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 8. Egress Gateway (上流公式 GHCR イメージ)
  # ----------------------------------------------------------------------------
  egress-gateway:
    image: ${CODEAPI_EGRESS_GATEWAY_IMAGE:-ghcr.io/librechat-ai/code-interpreter-egress-gateway:sha-2fa9f0d43e8e38b7d6240bc76e2483c6a47c64c7}
    container_name: rce-egress-gateway
    restart: unless-stopped
    pull_policy: missing
    environment:
      - SERVICE_NAME=egress-gateway
      - CODEAPI_HARDENED_SANDBOX_MODE=true
      - EGRESS_GATEWAY_PORT=3190
      - EGRESS_GATEWAY_FILE_SERVER_URL=http://file-server:3000
      - EGRESS_GATEWAY_TOOL_CALL_SERVER_URL=http://tool-call-server:3033
      - CODEAPI_EGRESS_GRANT_SECRET=${CODEAPI_EGRESS_GRANT_SECRET:?run ./setup.sh}
      - CODEAPI_INTERNAL_SERVICE_TOKEN=${CODEAPI_INTERNAL_SERVICE_TOKEN:?run ./setup.sh}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?run ./setup.sh}
    depends_on:
      redis:
        condition: service_healthy
      file-server:
        condition: service_healthy
      tool-call-server:
        condition: service_healthy
    networks:
      - rce-isolated
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3190/health').then(r=>process.exit(r.ok?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 9. File Server (上流公式 GHCR イメージ)
  # ----------------------------------------------------------------------------
  file-server:
    image: ${CODEAPI_FILE_SERVER_IMAGE:-ghcr.io/librechat-ai/code-interpreter-file-server:sha-2fa9f0d43e8e38b7d6240bc76e2483c6a47c64c7}
    container_name: rce-file-server
    restart: unless-stopped
    pull_policy: missing
    environment:
      - MINIO_BUCKET=${MINIO_BUCKET:-code-interpreter-files}
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-enterprise_rce_admin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:?run ./setup.sh}
      - FILE_SERVER_PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?run ./setup.sh}
      - CODEAPI_INTERNAL_SERVICE_TOKEN=${CODEAPI_INTERNAL_SERVICE_TOKEN:?run ./setup.sh}
    depends_on:
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - rce-isolated
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ----------------------------------------------------------------------------
  # 10. Tool Call Server (上流公式 GHCR イメージ)
  # ----------------------------------------------------------------------------
  tool-call-server:
    image: ${CODEAPI_TOOL_CALL_SERVER_IMAGE:-ghcr.io/librechat-ai/code-interpreter-tool-call-server:sha-2fa9f0d43e8e38b7d6240bc76e2483c6a47c64c7}
    container_name: rce-tool-call-server
    restart: unless-stopped
    pull_policy: missing
    environment:
      - TOOL_CALL_SERVER_PORT=3033
      - TOOL_CALL_REQUEST_TIMEOUT=300000
      - TOOL_CALL_SESSION_EXPIRY=600
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?run ./setup.sh}
      - CODEAPI_INTERNAL_SERVICE_TOKEN=${CODEAPI_INTERNAL_SERVICE_TOKEN:?run ./setup.sh}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - rce-isolated
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://localhost:3033/health').then(r=>process.exit(r.ok?0:1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mongo_data:
    driver: local
  minio_data:
    driver: local
