# ==============================================================================
# LibreChat RCE Stack - KVM オーバーライド (MicroVM モード)
# ==============================================================================
# /dev/kvm が存在するホストで使用します（./setup.sh が自動検出）
# ==============================================================================

services:
  sandbox-runner:
    image: ${SANDBOX_RUNNER_KVM_IMAGE:-ghcr.io/chottokun/librechat-rce-stack/sandbox-runner:2fa9f0d-ja1}
    privileged: false
    devices:
      - ${KVM_DEVICE_PATH:-/dev/kvm}:/dev/kvm
    environment:
      - KVM_ENABLED=true
      - LAUNCHER_VCPUS=2
      - LAUNCHER_RAM_MIB=2048
      - LAUNCHER_LOG_LEVEL=3
