name: Build & Publish Sandbox Runner

on:
  push:
    branches: [ "main" ]
    paths:
      - "sandbox/**"
      - "upstream.lock"
      - ".github/workflows/sandbox-image.yml"
  workflow_dispatch:
  schedule:
    # 毎週月曜 AM 3:00 (JST 12:00) に再ビルドしてベースOS脆弱性パッチを取り込む
    - cron: "0 3 * * 1"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-and-scan:
    name: Build & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read Upstream Lock
        id: lock
        run: |
          sha=$(grep -E "^CODEAPI_UPSTREAM_SHA=" upstream.lock | cut -d'=' -f2-)
          echo "upstream_sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - name: Clone Upstream Source & Apply Patches
        run: |
          git clone --depth 1 https://github.com/LibreChat-AI/code-interpreter.git upstream-src
          cd upstream-src
          git fetch --depth 1 origin ${{ steps.lock.outputs.upstream_sha }}
          git checkout ${{ steps.lock.outputs.upstream_sha }}
          cp ../sandbox/requirements-extra.txt docker/
          git apply ../sandbox/patches/0001-ja-extras.patch

      - name: Build KVM Sandbox Runner Image
        run: |
          cd upstream-src
          docker build -f api/Dockerfile --target sandbox-runner-true \
            -t ghcr.io/${{ github.repository }}/sandbox-runner:${{ steps.lock.outputs.short_sha }}-ja1 \
            -t ghcr.io/${{ github.repository }}/sandbox-runner:latest .

      - name: Build Direct Sandbox Runner Image
        run: |
          cd upstream-src
          docker build -f api/Dockerfile --target sandbox-runner-baked \
            -t ghcr.io/${{ github.repository }}/sandbox-runner-direct:${{ steps.lock.outputs.short_sha }}-ja1 \
            -t ghcr.io/${{ github.repository }}/sandbox-runner-direct:latest .

      - name: Install Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository }}/sandbox-runner-direct:${{ steps.lock.outputs.short_sha }}-ja1
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Images to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/${{ github.repository }}/sandbox-runner:${{ steps.lock.outputs.short_sha }}-ja1
          docker push ghcr.io/${{ github.repository }}/sandbox-runner:latest
          docker push ghcr.io/${{ github.repository }}/sandbox-runner-direct:${{ steps.lock.outputs.short_sha }}-ja1
          docker push ghcr.io/${{ github.repository }}/sandbox-runner-direct:latest
