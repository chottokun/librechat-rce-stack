name: CI / Lint & Static Validation

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-checks:
    name: Lint & Unit Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Lint Tools
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          npm install -g markdownlint-cli

      - name: ShellCheck Scripts
        run: |
          shellcheck -x setup.sh sandbox/build.sh scripts/*.sh scripts/lib/*.sh tests/unit/*.sh

      - name: MarkdownLint
        run: |
          markdownlint '**/*.md' --ignore 'node_modules/**'

      - name: Run Unit Tests (Idempotency & Ed25519)
        run: |
          bash tests/unit/test-generate-secrets.sh

      - name: Validate Compose Configs
        run: |
          cp .env.example .env
          bash scripts/generate-secrets.sh
          # KVM compose config syntax validation
          docker compose --env-file upstream.lock --env-file .env -f compose.yaml -f compose.kvm.yaml config > /dev/null
          # Direct compose config syntax validation
          docker compose --env-file upstream.lock --env-file .env -f compose.yaml -f compose.direct.yaml config > /dev/null
          # Build compose config syntax validation
          docker compose --env-file upstream.lock --env-file .env -f compose.yaml -f compose.direct.yaml -f compose.build.yaml config > /dev/null

  e2e-integration:
    name: Full Stack E2E Validation
    runs-on: ubuntu-latest
    needs: static-checks
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run One-Command Setup (Direct Mode)
        run: |
          ./setup.sh

      - name: Run E2E Integration Test Suite
        run: |
          bash tests/e2e/test-stack-e2e.sh
